<app-header></app-header>
<div class="destination-list">
  <h2><i class="fas fa-plane-departure"></i> Destinations</h2>
  <ul>
    <li *ngFor="let destination of destinations">
      <div class="card">
        <div class="image-container">
          <img *ngIf="destination.mainImageUrl" [src]="'http://localhost:9000/picloud/api/activities/images/' + destination.mainImageUrl" alt="{{destination.name}}" />
        </div>
        <h3>{{ destination.name }}</h3>
        <p>{{ destination.description }}</p>
        <button [routerLink]="['/destinations', destination.id]">View Details</button>
        <button [routerLink]="['/destinations', destination.id, 'activities']">View Activities</button>
      </div>
    </li>
  </ul>
</div>
