<header class="header">
    <!-- Topbar -->

    <!-- Topbar -->
    <div class="topbar bg-custom-blue">
        <div class="container">
            <div class="row">
                <div class="col-sm-6">
                    <div class="left-side">
                        <ul class="custom-flex">
                            <li>
                                <a href="#" class="text-custom-white">
                                    <i class="fab fa-facebook-f"></i>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="text-custom-white">
                                    <i class="fab fa-twitter"></i>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="text-custom-white">
                                    <i class="fab fa-instagram"></i>
                                </a>
                            </li>
                            <li>
                                <a href="#" class="text-custom-white">
                                    <i class="fab fa-linkedin"></i>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="col-sm-6">
                    <div class="right-side d-flex align-items-center justify-content-end">
                        <div class="cart-info mr-3">
                            <a routerLink="/panier" class="cart-icon text-custom-white">
                                <i class="fas fa-shopping-cart"></i>
                                <span class="cart-quantity" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
                            </a>
                        </div>

                        <!-- Si l'utilisateur n'est pas connecté -->
                        <ul class="custom-flex mb-0" *ngIf="!isUserLoggedIn">
                            <li>
                                <a routerLink="/login" class="text-custom-white">Login</a>
                            </li>
                            <li>
                                <a routerLink="/register" class="text-custom-white">Signup</a>
                            </li>
                        </ul>

                        <!-- Si l'utilisateur est connecté -->
                        <ul class="custom-flex user-dropdown mb-0" *ngIf="isUserLoggedIn" style="position: relative;">
                            <li class="dropdown">
                                <a href="javascript:void(0)" class="text-custom-white dropdown-toggle" (click)="toggleDropdown()">
                                    <!-- Avatar de l'utilisateur -->
                                    <img *ngIf="imageUrl" [src]="imageUrl"
                                         alt="User" class="user-avatar" (error)="handleImageError()"
                                         style="width: 25px; height: 25px; border-radius: 50%;">
                                    <img *ngIf="!imageUrl" src="assets/gestionuser/profile.jpg"
                                         alt="User" class="user-avatar"
                                         style="width: 25px; height: 25px; border-radius: 50%;">
                                    <span *ngIf="currentUser?.firstname" class="ml-1">{{ currentUser?.firstname }}</span>
                                </a>

                                <!-- Menu déroulant -->
                                <ul class="dropdown-menu" [ngClass]="{show: dropdownOpen}"
                                    style="position: absolute; top: 100%; right: 0; min-width: 150px; background-color: #fff; border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.1); z-index: 1000;">
                                    <li>
                                        <a href="javascript:void(0)" (click)="navigateToProfile()" class="dropdown-item" style="color: #333; padding: 8px 15px; display: block;">
                                            My Profile
                                        </a>
                                    </li>
                                    <li>
                                        <a href="javascript:void(0)" (click)="logout()" class="dropdown-item" style="color: #333; padding: 8px 15px; display: block;">
                                            Logout
                                        </a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="navigation" [ngClass]="windowScrolled ? 'sticky':''">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="main-navigation">
                        <div class="logo" style="margin-left: -20px;">
                            <a routerLink="/front-office/home-v2">
                                <img src="assets/Homepic/logo3.png" class="img-fluid image-fit" alt="img">
                            </a>
                        </div>
                        <div class="main-menu" [ngClass]="navMethod ? 'active' : ''">
                            <div class="logo">
                                <a routerLink="/front-office/home-v2">
                                    <img src="assets/Homepic/logo3.png "class="img-fluid image-fit" alt="img">
                                </a>
                            </div>
                            <nav>
                                <ul class="custom-flex">
                                    <li class="menu-item" [ngClass]="item.child == true ? 'menu-item-has-children' : ''"
                                        *ngFor="let item of navigation">
                                        <a href="javascript:void(0)" (click)="trigger(item)" *ngIf="item.child"
                                            class="text-light-dark">{{item.linkText}} <span class="arrow"></span></a>
                                        <a routerLink="{{item.link}}" *ngIf="!item.child"
                                            class="text-light-dark">{{item.linkText}}</a>
                                        <ul class="sub-menu custom" *ngIf="item.child"
                                            [ngClass]="item.open ? 'd-block' : ''">
                                            <li class="menu-item"
                                                [ngClass]="item.child == true ? 'menu-item-has-children' : ''"
                                                *ngFor="let item of item.submenu">
                                                <a href="javascript:void(0)" (click)="trigger(item)" *ngIf="item.child"
                                                    class="text-custom-white">{{item.linkText}} <span
                                                        class="arrow"></span></a>
                                                <a routerLink="{{item.link}}" *ngIf="!item.child"
                                                    class="text-custom-white">{{item.linkText}}</a>
                                                <ul class="sub-menu custom" *ngIf="item.child"
                                                    [ngClass]="item.open ? 'd-block' : ''">
                                                    <li class="menu-item" *ngFor="let item of item.submenu">
                                                        <a routerLink="{{item.link}}"
                                                            class="text-custom-white">{{item.linkText}}</a>
                                                    </li>
                                                </ul>
                                            </li>
                                        </ul>
                                    </li>
                                </ul>
                            </nav>
<!--                            <div class="cta-btn">-->
<!--                                <a routerLink="/booking" class="btn-first btn-submit">Enquiry Now</a>-->
<!--                            </div>-->
                        </div>
                        <div class="hamburger-menu" (click)="toggleNav()">
                            <div class="menu-btn" [ngClass]="navMethod ? 'active' : ''">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
