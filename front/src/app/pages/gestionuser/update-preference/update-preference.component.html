<div class="update-preference-container">
    <h2>Update Preference</h2>

    <div class="loading-container" *ngIf="isLoading">
        <div class="spinner"></div>
        <p>Loading preference data...</p>
    </div>

    <div *ngIf="!isLoading">
        <form [formGroup]="preferenceForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="name">Name*</label>
                <input
                        type="text"
                        id="name"
                        formControlName="name"
                        class="form-control"
                        [ngClass]="{'invalid': submitted && preferenceForm.get('name')?.errors}"
                >
                <div class="error-message" *ngIf="submitted && preferenceForm.get('name')?.errors?.['required']">
                    Name is required
                </div>
            </div>

            <div class="form-group">
                <label for="category">Category*</label>
                <select
                        id="category"
                        formControlName="category"
                        class="form-control"
                        [ngClass]="{'invalid': submitted && preferenceForm.get('category')?.errors}"
                >
                    <option value="" disabled>Select a category</option>
                    <option *ngFor="let category of categories" [value]="category">
                        {{ getCategoryDisplay(category) }}
                    </option>
                </select>
                <div class="error-message" *ngIf="submitted && preferenceForm.get('category')?.errors?.['required']">
                    Category is required
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn cancel-btn" (click)="onCancel()">Cancel</button>
                <button type="submit" class="btn submit-btn">Update Preference</button>
            </div>
        </form>

        <div class="alert alert-danger" *ngIf="errorMessage">
            {{ errorMessage }}
        </div>
    </div>
</div>
