<!-- auth-page wrapper -->
<div class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100">
  <div class="bg-overlay"></div>
  <!-- auth-page content -->
  <div class="auth-page-content overflow-hidden pt-lg-5">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="card overflow-hidden m-0">
            <div class="row justify-content-center g-0">
              <!-- Left panel with branding and travel quote -->
              <div class="col-lg-6">
                <div class="p-lg-5 p-4 auth-one-bg h-100">
                  <div class="bg-overlay"></div>
                  <div class="position-relative h-100 d-flex flex-column">
                    <div class="mb-4">
                      <a routerLink="/" class="d-block">
                        <h2 class="text-white">NomadLink</h2>
                      </a>
                    </div>

                    <!-- Featured image from assets -->
                    <div class="text-center my-5">
                      <img src="../../../../assets/gestionuser/u14.png" alt="Travel" class="img-fluid">
                    </div>

                    <div class="mt-auto text-center">
                      <div class="mb-3">
                        <i class="ri-double-quotes-l display-4 text-white"></i>
                      </div>
                      <p class="fs-15 text-white">"In attractive way to travel"</p>
                    </div>
                  </div>
                </div>
              </div>
              <!-- end col -->

              <!-- Right panel with activation form -->
              <div class="col-lg-6">
                <div class="p-lg-5 p-4">
                  <div *ngIf="submitted; else codeForm">
                    <div *ngIf="isOkay; else activationError">
                      <div class="mb-4 text-center">
                        <div class="avatar-lg mx-auto">
                          <div class="avatar-title bg-light text-success display-5 rounded-circle shadow">
                            <i class="ri-checkbox-circle-line"></i>
                          </div>
                        </div>
                      </div>
                      <div class="text-center">
                        <h4 class="text-success">Activation Successful!</h4>
                        <p class="text-muted mt-3">Your account has been successfully activated.</p>
                        <div class="mt-4">
                          <button type="button" class="btn btn-primary w-100" (click)="redirectToLogin()">Go to Login</button>
                        </div>
                      </div>
                    </div>
                    <ng-template #activationError>
                      <div class="mb-4 text-center">
                        <div class="avatar-lg mx-auto">
                          <div class="avatar-title bg-light text-danger display-5 rounded-circle shadow">
                            <i class="ri-close-circle-line"></i>
                          </div>
                        </div>
                      </div>
                      <div class="text-center">
                        <h4 class="text-danger">Activation Failed!</h4>
                        <p class="text-muted mt-3">{{ message }}</p>
                        <div class="mt-4">
                          <button type="button" class="btn btn-primary w-100" (click)="submitted = false">Try Again</button>
                        </div>
                      </div>
                    </ng-template>
                  </div>

                  <ng-template #codeForm>
                    <div class="mb-4">
                      <div class="avatar-lg mx-auto">
                        <div class="avatar-title bg-light text-primary display-5 rounded-circle shadow">
                          <i class="ri-mail-check-line"></i>
                        </div>
                      </div>
                    </div>
                    <div class="text-muted text-center mx-lg-3">
                      <h4 class="">Activate Your Account</h4>
                      <p>Please enter the 6 digit code sent to your email</p>
                    </div>

                    <div class="mt-4">
                      <div class="row">
                        <div class="col-12">
                          <div class="mb-3 text-center">
                            <code-input
                                    [isCodeHidden]="false"
                                    [codeLength]="6"
                                    [code]="'number'"
                                    (codeCompleted)="onCodeCompleted($event)"
                                    class="d-flex justify-content-center">
                            </code-input>
                          </div>
                        </div>
                      </div>

                      <div class="mt-3">
                        <button type="button" class="btn btn-primary w-100" (click)="redirectToLogin()">Back to Login</button>
                      </div>
                    </div>

                    <div class="mt-5 text-center">
                      <p class="mb-0">Didn't receive a code? <a href="javascript:void(0);" class="fw-semibold text-primary text-decoration-underline">Resend</a></p>
                    </div>
                  </ng-template>
                </div>
              </div>
              <!-- end col -->
            </div>
            <!-- end row -->
          </div>
          <!-- end card -->
        </div>
        <!-- end col -->
      </div>
      <!-- end row -->
    </div>
    <!-- end container -->
  </div>
  <!-- end auth page content -->

  <!-- footer -->
  <footer class="footer">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="text-center">
            <p class="mb-0">&copy; {{2025}} All rights reserved.</p>
          </div>
        </div>
      </div>
    </div>
  </footer>
  <!-- end Footer -->
</div>
<!-- end auth-page-wrapper -->
