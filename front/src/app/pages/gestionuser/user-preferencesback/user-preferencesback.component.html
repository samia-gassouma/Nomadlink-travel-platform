<!-- user-preferences.component.html -->
<div class="user-preferences-container">
    <div class="header-container">
        <h2>User Preferences</h2>
        <div class="header-buttons">
            <button class="btn btn-back" (click)="navigateBack()">
                <i class="fas fa-arrow-left"></i> Back to User Details
            </button>
        </div>
    </div>

    <!-- Loader -->
    <div *ngIf="isLoading" class="loading-container">
        <div class="spinner"></div>
        <p>Loading preferences...</p>
    </div>

    <!-- Error message -->
    <div *ngIf="error" class="error-container">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <div class="error-content">
            <h3>An error occurred</h3>
            <p>{{ error }}</p>
            <button class="btn btn-retry" (click)="loadUserPreferences()">Retry</button>
        </div>
    </div>

    <!-- User info header -->
    <div *ngIf="!isLoading && !error && user" class="user-mini-header">
        <h3>Preferences for {{ user.firstname }} {{ user.lastname }}</h3>
    </div>

    <!-- Preferences list -->
    <div *ngIf="!isLoading && !error" class="preferences-container">
        <!-- Empty state -->
        <div *ngIf="userPreferences.length === 0" class="empty-state">
            <i class="fas fa-heart-broken"></i>
            <h3>No Preferences Found</h3>
            <p>This user has not set any preferences yet.</p>
            <button class="btn btn-primary" (click)="navigateBack()">Back to User Details</button>
        </div>

        <!-- Preferences grid -->
        <div *ngIf="userPreferences.length > 0" class="preferences-grid">
            <div class="preference-card" *ngFor="let preference of userPreferences" [ngClass]="'category-' + preference.category">
                <div class="preference-content">
                    <span class="preference-name">{{preference.name}}</span>
                    <span class="preference-category">{{preference.category}}</span>
                </div>
<!--                <button class="btn-icon" (click)="removeUserPreference(preference.id)" title="Remove preference">-->
<!--                    <i class="fas fa-times"></i>-->
<!--                </button>-->
            </div>
        </div>
    </div>
</div>
