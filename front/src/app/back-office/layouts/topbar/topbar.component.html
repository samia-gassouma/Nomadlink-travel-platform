<header id="page-topbar" data-scroll-header (window:scroll)="windowScroll()">
    <div class="layout-width">
        <div class="navbar-header">
            <div class="d-flex">
                <!-- LOGO -->
                <div class="navbar-brand-box horizontal-logo">
                    <a href="javascript:void(0);" class="logo logo-dark">
                        <span class="logo-sm">
                            <img src="assets/back-office/images/logo-sm.png" alt="" height="22">
                        </span>
                        <span class="logo-lg">
                            <img src="assets/back-office/images/logo-dark.png" alt="" height="17">
                        </span>
                    </a>

                    <a href="javascript:void(0);" class="logo logo-light">
                        <span class="logo-sm">
                            <img src="assets/back-office/images/logo-sm.png" alt="" height="22">
                        </span>
                        <span class="logo-lg">
                            <img src="assets/back-office/images/logo-light.png" alt="" height="17">
                        </span>
                    </a>
                </div>

                <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger" id="topnav-hamburger-icon" (click)="toggleMobileMenu($event)">
                    <span class="hamburger-icon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>


            </div>

            <div class="d-flex align-items-center">









                <button type="button" class="btn btn-sm btn-primary" (click)="navigateToFrontOffice()">
                    <i class="ri-home-4-line me-1"></i>Front Office
                </button>
                <div class="dropdown ms-sm-3 header-item topbar-user" ngbDropdown>


                    <!-- If user is logged in, show user info -->
                    <button *ngIf="isUserLoggedIn" type="button" class="btn shadow-none" id="page-header-user-dropdown" data-bs-toggle="dropdown" (click)="toggleDropdown()" aria-haspopup="true" aria-expanded="false" ngbDropdownToggle>
        <span class="d-flex align-items-center">
            <!-- User Avatar -->
            <img *ngIf="imageUrl" [src]="imageUrl"
                 (error)="handleImageError()"
                 class="rounded-circle header-profile-user" alt="User Avatar">
            <img *ngIf="!imageUrl" src="assets/gestionuser/profile.jpg"
                 class="rounded-circle header-profile-user" alt="Default User Avatar">

            <span class="text-start ms-xl-2">
                <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">
                    {{ currentUser?.firstname }}
                </span>
                <span class="d-none d-xl-block ms-1 fs-12 text-muted user-name-sub-text">
                    {{ currentUser?.role || 'User' }}
                </span>
            </span>
        </span>
                    </button>

                    <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu [ngClass]="{show: dropdownOpen}">
                        <!-- item-->
                        <h6 class="dropdown-header">Welcome {{ currentUser?.firstname || 'User' }}!</h6>
                        <a class="dropdown-item" href="javascript:void(0);" (click)="navigateToProfile()">
                            <i class="mdi mdi-account-circle text-muted fs-16 align-middle me-1"></i>
                            <span class="align-middle">Profile</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="javascript:void(0);" (click)="logout()">
                            <i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i>
                            <span class="align-middle" data-key="t-logout">Logout</span>
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</header>
