<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-header">
        <div class="d-flex align-items-center flex-wrap gap-2">
          <div class="flex-grow-1">
            <h4 class="mb-sm-0">Invoices List </h4>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="listFactures?.length" class="card-body" style="margin: 0px 50px 150px 50px;">
    <div class="live-preview">
      <div class="table-responsive">
        <table class="table align-middle table-nowrap mb-0">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Date</th>
              <th scope="col">Amount</th>
              <th scope="col">URL</th>
              <th scope="col">User</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let facture of listFactures; let i = index">
              <th scope="row"><a [routerLink]="backoffice ? ['/back-office/paiement/getFacture', facture.id] : ['/front-office/paiement/getFacture', facture.id]">Invoice{{i+1}}</a></th>
              <td>{{facture.date_emission | date : "dd MMM, yyyy HH:mm"}}</td>
              <td>{{facture.montant_total}} TND</td>
              <td>
                <a [href]="facture.url" target="_blank">
                  {{ facture.url | slice:0:30 }}{{ facture.url.length > 30 ? '...' : '' }}
                </a>
              </td>
              
              <td>
                <div class="d-flex gap-2 align-items-center">
                  <div class="flex-shrink-0">
                      <img [src]="imageBaseUrl + facture.user.profilePicture" alt=""
                          class="avatar-xs rounded-circle" />
                  </div>
                  <div class="flex-grow-1">
                    {{facture.user.firstname}} {{facture.user.lastname}}
                  </div>
              </div></td>
              <td>
                <ul class="list-inline hstack gap-2 mb-0">
                  <li class="list-inline-item me-0" ngbTooltip="Delete" placement="top">
                    <a (click)="delete(facture.id,i)" class="remove-item-btn" data-bs-toggle="modal">
                      <i class="ri-delete-bin-fill align-bottom text-muted"></i>
                    </a>
                  </li>
                </ul>
                </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div *ngIf="!listFactures?.length">
  <h6>No Invoice added.</h6>
</div>
