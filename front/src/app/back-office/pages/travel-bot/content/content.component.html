<div class="card">
    <div class="card-header">
      <h2>Knowlegde Base</h2>
    </div>
    <div class="card-body">
      <div class="mb-3">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Search knowledge base..." 
          [(ngModel)]="searchTerm"
        >
      </div>
      
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      
      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>
      
      <div *ngIf="!loading && !error">
        <p *ngIf="ContentItems.length === 0" class="text-center py-3">
          No knowledge items found. Add some on the "Add Content" page.
        </p>
        
        <p *ngIf="ContentItems.length > 0 && filteredItems.length === 0" class="text-center py-3">
          No results matching your search criteria.
        </p>
        
        <div *ngIf="filteredItems.length > 0" class="accordion" id="knowledgeAccordion">
          <div *ngFor="let item of filteredItems; let i = index" class="accordion-item">
            <h2 class="accordion-header" [id]="'heading' + i">
              <button 
                class="accordion-button collapsed" 
                type="button" 
                data-bs-toggle="collapse" 
                [attr.data-bs-target]="'#collapse' + i" 
                aria-expanded="false" 
                [attr.aria-controls]="'collapse' + i"
              >
                {{ item.Question }}
              </button>
            </h2>
            <div 
              [id]="'collapse' + i" 
              class="accordion-collapse collapse" 
              [attr.aria-labelledby]="'heading' + i" 
              data-bs-parent="#knowledgeAccordion"
            >
              <div class="accordion-body">
                {{ item.Response }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
