<div class="card mt-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3>Answer</h3>
      <span class="badge rounded-pill" [ngClass]="result.confidence > 0.7 ? 'bg-success' : result.confidence > 0.4 ? 'bg-warning' : 'bg-danger'">
        {{ getConfidencePercent() }} confidence
      </span>
    </div>
    <div class="card-body">
      <p class="lead">{{ result.Response }}</p>
      
      <div *ngIf="result.question_matched" class="mt-3">
        <h5>Matched Question:</h5>
        <p class="font-italic">{{ result.question_matched }}</p>
      </div>
      
      <div *ngIf="result.similar_questions && result.similar_questions.length > 0" class="mt-3">
        <h5>Similar Questions:</h5>
        <ul class="list-group">
          <li *ngFor="let question of result.similar_questions" class="list-group-item">
            {{ question }}
          </li>
        </ul>
      </div>
    </div>
  </div>
