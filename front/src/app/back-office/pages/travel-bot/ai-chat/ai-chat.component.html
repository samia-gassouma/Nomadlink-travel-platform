<!-- chat.component.html -->
<div class="chat-container">
    <div class="chat-messages" #scrollContainer>
      <div *ngFor="let message of messages" 
           [ngClass]="{'user-message': message.isUser, 'bot-message': !message.isUser}"
           class="message-container">
        <div class="message-bubble">
          <div class="message-content">{{ message.content }}</div>
          <div class="message-timestamp">{{ message.timestamp | date:'shortTime' }}</div>
        </div>
      </div>
      
      <div *ngIf="isLoading" class="bot-message message-container">
        <div class="message-bubble">
          <div class="message-content loading-indicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    </div>
    
    <form [formGroup]="chatForm" (ngSubmit)="sendMessage()" class="chat-input-form">
      <input 
        type="text" 
        formControlName="message"
        placeholder="Type your message..."
        class="chat-input" 
        autocomplete="off"
      />
      <button 
        type="submit" 
        class="send-button"
        [disabled]="chatForm.invalid || isLoading">
        Send
      </button>
    </form>
  </div>
