
  <div class="col-lg-12">
    <div class="card">
      <div class="card-header">
        <div class="d-flex align-items-center flex-wrap gap-2">
          <div class="flex-grow-1">
            <h4 class="mb-sm-0">Price plans List</h4>
          </div>
        </div>
      </div>
    </div>
  </div>
<div *ngIf="listPricePlan" class="card-body mb-4" style="margin: 0px 50px 150px 50px;">
  <div class="live-preview">
    <div class="table-responsive">
      <table class="table align-middle table-nowrap mb-0">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Price</th>
            <th scope="col">Pack</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of listPricePlan; let i = index">
            <th scope="row"><a href="javascript:void(0);" class="fw-medium"><a
                  [routerLink]="['/back-office/packs/price-plan/get', p.id]">Price Plan {{ i + 1 }}</a></a></th>
            <td>{{ p.name }}</td>
            <td>{{ p.price }}</td>
            <td><a [routerLink]="['/back-office/packs/pack', 'get', p.pack!.id]">pack</a></td>
            <td>
              <ul class="list-inline hstack gap-2 mb-0">
                <li class="list-inline-item" ngbTooltip="Edit" placement="top">
                  <a [routerLink]="['/back-office/packs/price-plan', 'update',p.id]" class="edit-item-btn"
                    data-bs-toggle="modal"><i class="ri-pencil-fill align-bottom text-muted"></i></a>
                </li>
                <li class="list-inline-item me-0" ngbTooltip="Delete" placement="top">
                  <a (click)="remove(p.id, i)" class="remove-item-btn" data-bs-toggle="modal">
                    <i class="ri-delete-bin-fill align-bottom text-muted"></i>
                  </a>
                </li>
              </ul>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div *ngIf="!listPricePlan">
  <h6>No price plans added.</h6>
</div>
