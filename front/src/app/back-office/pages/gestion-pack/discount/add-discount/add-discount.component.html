<form [formGroup]="discountForm" (ngSubmit)="submitForm()">
  <div class="col-lg-4 mt-4">
    <div>
      <label for="placeholderInput" class="form-label">Percentage</label>
      <input formControlName="reduction_percent" type="number" class="form-control" id="placeholderInput"
        placeholder="Percentage">
    </div>
  </div>
  <div class="col-lg-4 mt-4">
    <div>
      <label class="form-label mb-0">Start Date</label>
      <input formControlName="date_debut" class="form-control flatpickr-input" type="text" mwlFlatpickr
        [altInput]="true" [enableTime]="true" [convertModelValue]="true" altFormat="d.m.y H:i"
        [dateFormat]="'d.m.y H:i'" placeholder="Start Date">
    </div>
  </div>
  <div class="col-lg-4 mt-4">
    <div>
      <label class="form-label mb-0">End Date</label>
      <input formControlName="date_fin" class="form-control flatpickr-input" type="text" mwlFlatpickr [altInput]="true"
        [enableTime]="true" [convertModelValue]="true" altFormat="d.m.y H:i" [dateFormat]="'d.m.y H:i'"
        placeholder="End Date">
    </div>
  </div>

  <div class="col-lg-4 mt-4">
    <h5 class="fs-14 mb-3">Select Packs</h5>
      <div class="mb-3">
        <ng-select formControlName="pack" [items]="listPacks" bindLabel="packName" bindValue="id" [multiple]="true"
          placeholder="Choose packs...">
        </ng-select>
      </div>
  </div>

  <div class="col-lg-4 mt-4 mb-4">
    <div class="text-end">
        <button [disabled]="discountForm.invalid" type="submit" class="btn btn-primary">Submit</button>
    </div>
</div>
</form>
